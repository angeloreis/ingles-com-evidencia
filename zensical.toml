# Configuração do site Inglês com Evidência (Zensical).
# Só a pasta conteudo/ é publicada; docs/ guarda os documentos do projeto.

[project]
site_name = "Inglês com Evidência"
site_description = "Guia aberto e gratuito que confere com a pesquisa as técnicas vendidas pelos cursos de inglês, com um kit para praticar."
site_url = "https://angeloreis.github.io/ingles-com-evidencia/"
copyright = "Conteúdo sob CC BY-SA 4.0 · código sob MIT"
docs_dir = "conteudo"
# Sem repo_url: o cabeçalho do tema buscaria dados na API do GitHub pelo
# navegador de quem visita. O link para o repositório fica na página Sobre.
extra_css = [
  "estilos/fontes.css",
  "estilos/tokens.css",
  "estilos/bundle.css",
  "estilos/ponte.css",
]
# Ordem importa: núcleo, lógica pura, depois as páginas.
extra_javascript = [
  "js/nucleo.js",
  "js/logica/datas.js",
  "js/logica/audio.js",
  "js/logica/treino.js",
  "js/logica/plano.js",
  "js/logica/ficha.js",
  "js/paginas/audio.js",
  "js/paginas/roteiro.js",
  "js/paginas/treino.js",
  "js/paginas/hoje.js",
  "js/paginas/ficha.js",
]
nav = [
  { "Início" = "index.md" },
  { "Guia" = [
    { "Visão geral" = "guia/index.md" },
    { "1. Como usar este guia" = "guia/como-usar.md" },
    { "6. Frases-chave e blocos prontos" = "guia/frases-chave.md" },
    { "8. Shadowing" = "guia/shadowing.md" },
    { "9. Fluência na fala" = "guia/fluencia.md" },
    { "10. Medo de falar e confiança" = "guia/medo-de-falar.md" },
    { "11. Treinar com IA no modo de voz" = "guia/ia-modo-de-voz.md" },
  ] },
  { "Situações" = [
    { "Visão geral" = "situacoes/index.md" },
    { "Imigração no aeroporto ou na fronteira" = "situacoes/imigracao.md" },
    { "Restaurante" = "situacoes/restaurante.md" },
    { "Táxi ou carro de aplicativo" = "situacoes/taxi.md" },
    { "Polícia: pedir ajuda e abordagem" = "situacoes/policia.md" },
    { "Puxar conversa" = "situacoes/conversa.md" },
    { "Telefonar e marcar reunião" = "situacoes/telefonar.md" },
    { "Programação, IA e frameworks" = "situacoes/tecnologia.md" },
    { "Entrevista para trabalho remoto" = "situacoes/entrevista.md" },
  ] },
  { "Trilhas e planos" = [
    { "Visão geral" = "trilhas/index.md" },
    { "Destravar a fala: hoje" = "trilhas/destravar/hoje.md" },
    { "Destravar a fala: semanas" = "trilhas/destravar/index.md" },
    { "Destravar a fala: ficha" = "trilhas/destravar/ficha.md" },
  ] },
  { "Treinar cartas" = "treinar.md" },
  { "Sobre e créditos" = "sobre.md" },
]

[project.extra]
# Sem "Made with Zensical" no rodapé: o site é todo em português.
generator = false

[project.theme]
language = "pt-BR"
# As fontes vêm de conteudo/estilos/fontes.css, não do Google Fonts.
font = false
features = [
  "navigation.instant",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
]

# Tema: começa seguindo o aparelho; o botão alterna entre
# automático → claro → escuro → automático.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Mudar para o tema claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Mudar para o tema escuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Seguir o tema do aparelho"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
# Trechos gerados em kit/gerado/ entram nas páginas com --8<-- "kit/gerado/arquivo.md";
# trecho ausente derruba o build.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
toc.permalink = true
toc.permalink_title = "Link para esta seção"
