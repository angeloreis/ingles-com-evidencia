name: Site

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m scripts.construir

  publicar:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ingles-com-evidencia/kokoro
          key: kokoro-v1.0-beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a
      - run: pip install -r requirements-site.txt -r requirements-kit.txt
      - run: python -m scripts.construir --audio
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment

  baralhos:
    needs: verificar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ingles-com-evidencia/kokoro
          key: kokoro-v1.0-beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a
      - run: pip install -r requirements-site.txt -r requirements-kit.txt
      - run: python -m scripts.construir --audio --baralhos
      - run: gh release create "$GITHUB_REF_NAME" dist/baralhos/*.apkg --title "Baralhos $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
