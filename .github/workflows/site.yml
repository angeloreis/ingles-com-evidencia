name: Site

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-dev.txt -c requirements-travado.txt
      - run: python -m pytest -q
      - run: python -m scripts.construir

  publicar:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ingles-com-evidencia/kokoro
          key: kokoro-v1.0-beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a-bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
      # O áudio volta do cache e só as frases que mudaram são sintetizadas de novo (M13 da 1A).
      - uses: actions/cache@v5
        with:
          path: conteudo/audio
          key: audio-${{ hashFiles('kit/dados/*.csv', 'kit/dialogos/*.csv', 'scripts/audio.py', 'requirements-travado.txt') }}
          restore-keys: audio-
      - run: pip install -r requirements-site.txt -r requirements-kit.txt -c requirements-travado.txt
      - run: python -m scripts.construir --audio
      - run: zensical build --clean --strict
      # Um pacote por tentativa: rodar de novo o job que falhou não deixa dois "github-pages" na mesma execução,
      # o que o deploy-pages recusa.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  baralhos:
    needs: verificar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ingles-com-evidencia/kokoro
          key: kokoro-v1.0-beb0d1848dee9a49da392cc3df26958d46cfa35d321edf434f52949153f0df3a-bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
      # O áudio volta do cache e só as frases que mudaram são sintetizadas de novo (M13 da 1A).
      - uses: actions/cache@v5
        with:
          path: conteudo/audio
          key: audio-${{ hashFiles('kit/dados/*.csv', 'kit/dialogos/*.csv', 'scripts/audio.py', 'requirements-travado.txt') }}
          restore-keys: audio-
      - run: pip install -r requirements-site.txt -r requirements-kit.txt -c requirements-travado.txt
      - run: python -m scripts.construir --audio --baralhos
      # Rodar o job de novo (por exemplo, depois de uma falha) troca os arquivos da Release em vez de falhar.
      - run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/baralhos/*.apkg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/baralhos/*.apkg --title "Baralhos $GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
